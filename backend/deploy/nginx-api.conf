server {
    listen 80;
    server_name api.bihartailiksahusabha.com;

    # Uploads arrive as base64 JSON (gallery videos up to ~14 MB before encoding)
    client_max_body_size 25M;

    # Django admin / DRF static files (collected by `manage.py collectstatic`)
    location /static/ {
        alias /var/www/sahu/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
